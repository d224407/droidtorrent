name: Build Android
on:
  push:
    branches: ['**']
    tags: ['*']
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Decode signing files
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEY_STORE }}
          PROPS: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE" | base64 -di > android-keystore.jks
          echo "$PROPS" | base64 -di > key.properties
      - run: gradle assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: droidtorrent-android
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
