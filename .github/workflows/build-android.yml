name: Build Android
on:
  push:
    branches: ['**']
    tags: ['*']
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'
      - name: Decode signing files
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEY_STORE }}
          PROPS: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE" | base64 -di > android-keystore.jks
          echo "$PROPS" | base64 -di > key.properties
      - run: gradle assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: droidtorrent-android
          path: app/build/outputs/apk/release/*.apk
